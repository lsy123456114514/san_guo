name: CI

on:
  push:
    branches: [main, "C[+][+]andpy"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce

      - name: Syntax check (py_compile all modules)
        run: |
          python -m compileall -q main.py ASSET auto_test.py

      - name: Menu catalog self-check
        run: python auto_test.py --list

      - name: Smoke test all modules
        run: python auto_test.py --all --fast
