name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - { name: win-x64-onefile, os: windows-latest, platform: win-x64, mode: onefile }
          - { name: win-x64-onedir, os: windows-latest, platform: win-x64, mode: onedir }
          # Windows x86 (32-bit)
          - { name: win-x86-onefile, os: windows-latest, platform: win-x86, mode: onefile, python-arch: x86 }
          - { name: win-x86-onedir, os: windows-latest, platform: win-x86, mode: onedir, python-arch: x86 }
          # Windows ARM64 (experimental)
          - { name: win-arm64-onefile, os: windows-11-arm, platform: win-arm64, mode: onefile, experimental: true }
          - { name: win-arm64-onedir, os: windows-11-arm, platform: win-arm64, mode: onedir, experimental: true }
          # Linux x64 (新 glibc)
          - { name: linux-x64-onefile, os: ubuntu-latest, platform: linux-x64, mode: onefile }
          - { name: linux-x64-onedir, os: ubuntu-latest, platform: linux-x64, mode: onedir }
          # Linux x64 (旧 glibc, Ubuntu 22.04 兼容更老发行版)
          - { name: linux-x64-u22-onefile, os: ubuntu-22.04, platform: linux-x64-u22, mode: onefile }
          - { name: linux-x64-u22-onedir, os: ubuntu-22.04, platform: linux-x64-u22, mode: onedir }
          # Linux ARM64 (aarch64 开发板/服务器)
          - { name: linux-arm64-onefile, os: ubuntu-24.04-arm, platform: linux-arm64, mode: onefile }
          - { name: linux-arm64-onedir, os: ubuntu-24.04-arm, platform: linux-arm64, mode: onedir }
          # macOS Intel
          - { name: macos-x64-onefile, os: macos-15-intel, platform: macos-x64, mode: onefile }
          - { name: macos-x64-onedir, os: macos-15-intel, platform: macos-x64, mode: onedir }
          # macOS Apple Silicon
          - { name: macos-arm64-onefile, os: macos-14, platform: macos-arm64, mode: onefile }
          - { name: macos-arm64-onedir, os: macos-14, platform: macos-arm64, mode: onedir }
          - { name: macos15-arm64-onefile, os: macos-15, platform: macos15-arm64, mode: onefile }
          - { name: macos15-arm64-onedir, os: macos-15, platform: macos15-arm64, mode: onedir }

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (x86)
        if: matrix.python-arch == 'x86'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86

      - name: Set up Python
        if: matrix.python-arch != 'x86'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pygame-ce pyinstaller PyOpenGL

      - name: Build with PyInstaller
        shell: bash
        run: |
          set -euo pipefail
          SEP=":"
          if [[ "$RUNNER_OS" == "Windows" ]]; then SEP=";"; fi
          BASE="san_guo-${{ matrix.platform }}-${{ matrix.mode }}"
          ARGS=(
            --noconfirm
            --name "$BASE"
            --add-data "ASSET${SEP}ASSET"
            --add-data "data${SEP}data"
            --add-data "renderer_bindings.py${SEP}."
            --collect-submodules ASSET
            --exclude-module tkinter
            --exclude-module numpy
            --exclude-module setuptools
            --exclude-module pip
            --exclude-module PyQt5
            --exclude-module matplotlib
            --exclude-module scipy
            --exclude-module pandas
            --exclude-module PIL
          )
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ARGS+=(--add-data "opengl_renderer.dll${SEP}." --icon "ASSET/icon.ico" --windowed)
          fi
          if [[ "${{ matrix.mode }}" == "onefile" ]]; then
            ARGS+=(--onefile)
          else
            ARGS+=(--onedir)
          fi
          pyinstaller "${ARGS[@]}" main.py

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          BASE="san_guo-${{ matrix.platform }}-${{ matrix.mode }}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            if [[ "${{ matrix.mode }}" == "onefile" ]]; then
              7z a "${BASE}.zip" "dist/${BASE}.exe" >/dev/null
            else
              (cd dist && 7z a "../${BASE}.zip" "$BASE" >/dev/null)
            fi
            ls -la "${BASE}.zip"
          else
            if [[ "${{ matrix.mode }}" == "onefile" ]]; then
              chmod +x "dist/${BASE}"
              tar -czf "${BASE}.tar.gz" -C dist "$BASE"
            else
              tar -czf "${BASE}.tar.gz" -C dist "$BASE"
            fi
            ls -la "${BASE}.tar.gz"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            san_guo-${{ matrix.platform }}-*.zip
            san_guo-${{ matrix.platform }}-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  source:
    name: source-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack source
        run: |
          git archive --format=tar.gz -o san_guo-source.tar.gz HEAD
          git archive --format=zip -o san_guo-source.zip HEAD

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            san_guo-source.tar.gz
            san_guo-source.zip
          retention-days: 30

  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false
